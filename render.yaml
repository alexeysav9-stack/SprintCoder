services:
  - type: web
    name: sprintcoder
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: ./render_build.sh
    startCommand: gunicorn sprintcoder.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: TIME_ZONE
        value: Europe/Moscow
      - key: ENABLE_SOCIAL_AUTH
        value: "False"
      - key: DATABASE_URL
        sync: false
