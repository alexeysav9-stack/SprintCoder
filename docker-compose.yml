services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sprintcoder}
      POSTGRES_USER: ${DB_USER:-sprintcoder}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sprintcoder_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sprintcoder} -d ${DB_NAME:-sprintcoder}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
