{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | SprintCoder Admin{% endblock %}

{% block branding %}
<div id="site-name">
  <a href="{% url 'admin:index' %}">
    <span style="font-size: 1.15rem; font-weight: 800; color: #9e92ff;">⌨️ SprintCoder</span>
    <span style="font-size: 0.85rem; color: #a0aec0; margin-left: 6px;">Управление</span>

{% block userlinks %}

    <span>📊 Аналитика платформы</span>

  {{ block.super }}
