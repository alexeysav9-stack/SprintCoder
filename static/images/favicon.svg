<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Keycap top gradient -->
    <linearGradient id="keyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8f82fc"/>
      <stop offset="100%" stop-color="#705ef8"/>
    </linearGradient>
    <!-- Keycap front/bottom bevel gradient -->
    <linearGradient id="keyFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5544d6"/>
      <stop offset="100%" stop-color="#3e2fb3"/>
    </linearGradient>
    <!-- Keycap side bevel gradient -->
    <linearGradient id="keySide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6755e3"/>
      <stop offset="100%" stop-color="#4f3ec7"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <!-- Key C (Top: cx=32, cy=18) -->
    <g transform="translate(32, 17)">
      <!-- Shadow base -->
      <path d="M-8 3 L8 -1 L10 5 L-6 9 Z" fill="#2a1f7a" opacity="0.5"/>
      <!-- Front & Side faces -->
      <path d="M-9 2 L-6 9 L10 5 L7 -2 Z" fill="url(#keyFront)"/>
      <path d="M-9 2 L-11 -4 L-8 -6 L-6 9 Z" fill="url(#keySide)"/>
      <!-- Top Face -->
      <rect x="-9" y="-8" width="17" height="14" rx="3" fill="url(#keyTop)" transform="matrix(0.93 -0.28 0.2 0.95 0 0)"/>
      <!-- Letter C -->
      <text x="0.5" y="2" font-family="'JetBrains Mono', 'Fira Code', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="matrix(0.93 -0.28 0.2 0.95 0 0)">C</text>
    </g>

    <!-- Key O (Bottom Left: cx=16, cy=38) -->
    <g transform="translate(16, 39)">
      <rect x="-9" y="-8" width="17" height="14" rx="3" fill="url(#keyTop)" transform="matrix(0.93 -0.28 0.2 0.95 0 0)"/>
      <text x="0.5" y="2" font-family="'JetBrains Mono', 'Fira Code', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="matrix(0.93 -0.28 0.2 0.95 0 0)">O</text>
    </g>

    <!-- Key D (Bottom Middle: cx=32, cy=34) -->
    <g transform="translate(32, 35)">
      <rect x="-9" y="-8" width="17" height="14" rx="3" fill="url(#keyTop)" transform="matrix(0.93 -0.28 0.2 0.95 0 0)"/>
      <text x="0.5" y="2" font-family="'JetBrains Mono', 'Fira Code', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="matrix(0.93 -0.28 0.2 0.95 0 0)">D</text>
    </g>

    <!-- Key E (Bottom Right: cx=48, cy=30) -->
    <g transform="translate(48, 31)">
      <rect x="-9" y="-8" width="17" height="14" rx="3" fill="url(#keyTop)" transform="matrix(0.93 -0.28 0.2 0.95 0 0)"/>
      <text x="0.5" y="2" font-family="'JetBrains Mono', 'Fira Code', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" transform="matrix(0.93 -0.28 0.2 0.95 0 0)">E</text>
    </g>
  </g>
</svg>